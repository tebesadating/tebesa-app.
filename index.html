<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tebesa - Login with Telegram</title>
<style>body{font-family:system-ui,sans-serif;background:#120E12;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}</style>
</head><body>
<h2>Tebesa</h2>
<p id="msg">Tap the button to log in with Telegram.</p>
<!-- replace tebesadating_bot (no @). Your domain must be set with BotFather: /setdomain -->
<script async src="https://telegram.org/js/telegram-widget.js?22"
  data-telegram-login=tebesadating_bot data-size="large" data-userpic="false"
  data-request-access="write" data-onauth="onTelegramAuth(user)"></script>
<script>
const API='https://wisemrodjophhzcnkmst.supabase.co/functions/v1/rapid-processor';
const KEY='sb_publishable_lfGEMbXwTAxXBTATVFnFxA_SItmRBs2';
const token=new URLSearchParams(location.search).get('t')||'';
async function onTelegramAuth(user){
  const msg=document.getElementById('msg');
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
      body:JSON.stringify({action:'app_login_push',token,data:new URLSearchParams(user).toString()})});
    msg.textContent=r.ok?'Logged in. Go back to the Tebesa app.':'Login failed. Please try again from the app.';
  }catch(e){ msg.textContent='Network error. Please try again.'; }
}
</script>
</body></html>
