<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Tebesa Login</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui,sans-serif;background:#120E12;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;text-align:center}
h2{margin:0 0 12px}p{opacity:.85;line-height:1.5;max-width:320px}
input{font-size:32px;letter-spacing:.4em;text-align:center;width:9em;padding:12px;border-radius:14px;border:1px solid #ffffff33;background:#ffffff10;color:#fff;margin:14px 0}
button{font-size:18px;font-weight:700;padding:14px 36px;border:0;border-radius:14px;background:#e11d74;color:#fff}
button:disabled{opacity:.5}
</style>
</head><body>
<h2>Tebesa</h2>
<p id="msg">Type the 4-digit code shown in the Tebesa app to log in.</p>
<input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code" placeholder="0000">
<button id="go" type="button" disabled>Log in</button>
<p style="font-size:12px;opacity:.6;margin-top:18px">Only enter a code that you see in YOUR OWN Tebesa app. Never type a code that someone else sends you.</p>
<script>
const API='https://wisemrodjophhzcnkmst.supabase.co/functions/v1/tebesa-gateway';
const KEY='sb_publishable_lfGEMbXwTAxXBTATVFnFxA_SItmRBs2';
const tg=window.Telegram&&Telegram.WebApp;
const msg=document.getElementById('msg'), codeEl=document.getElementById('code'), go=document.getElementById('go');
let token='';
(function init(){
  if(!tg||!tg.initData){ msg.textContent='Please open this from the Tebesa app.'; codeEl.style.display='none'; go.style.display='none'; return; }
  tg.ready(); try{tg.expand();}catch(e){}
  token=(tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'';
  if(!/^[a-f0-9]{48}$/.test(token)){ msg.textContent='This login link is not valid or is out of date. Please try again from the Tebesa app.'; codeEl.style.display='none'; go.style.display='none'; return; }
  codeEl.addEventListener('input',function(){ codeEl.value=codeEl.value.replace(/\D/g,'').slice(0,4); go.disabled=codeEl.value.length!==4; });
  go.addEventListener('click',submit);
})();
async function submit(){
  go.disabled=true; msg.textContent='Checking...';
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},
      body:JSON.stringify({action:'login_push',token:token,code:codeEl.value,data:tg.initData})});
    const j=await r.json().catch(function(){return {};});
    if(r.ok){
      msg.innerHTML='&#9989; Logged in.<br>Go back to the Tebesa app.';
      codeEl.style.display='none'; go.style.display='none';
      setTimeout(function(){ try{tg.close();}catch(e){} },1800);
    } else if(j.error==='bad_code'){
      msg.textContent='Wrong code. Check the code in the Tebesa app and try again.'; go.disabled=false;
    } else {
      msg.textContent='Login failed. Please try again from the Tebesa app.';
    }
  }catch(e){ msg.textContent='Network error. Please try again.'; go.disabled=false; }
}
</script>
</body></html>
